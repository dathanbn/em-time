<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Em Time</title>
    <meta name="theme-color" content="#4FA8EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Em Time" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <script>
      // First paint matches the coming sky: polarity and background by the local clock.
      (function () {
        var d = new Date();
        var m = d.getHours() * 60 + d.getMinutes();
        var light = m >= 315 && m < 1020;
        try {
          var s = JSON.parse(localStorage.getItem('em-time:data') || 'null');
          var t = s && s.settings && s.settings.theme;
          if (t === 'dark') light = false;
          else if (t === 'light') light = true;
        } catch (e) {}
        var r = document.documentElement;
        r.setAttribute('data-theme', light ? 'light' : 'dark');
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background-color: #8cc8f5;
        color: #13202f;
        font-family:
          ui-rounded,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: #16244d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg width="72" height="54" viewBox="0 0 120 90">
        <g fill="#fff" stroke="#a9d2f2" stroke-width="5" stroke-linejoin="round">
          <circle cx="34" cy="52" r="20" />
          <circle cx="58" cy="38" r="26" />
          <circle cx="84" cy="48" r="20" />
          <rect x="14" y="48" width="92" height="30" rx="15" />
        </g>
        <g fill="#fff">
          <circle cx="34" cy="52" r="20" />
          <circle cx="58" cy="38" r="26" />
          <circle cx="84" cy="48" r="20" />
          <rect x="14" y="48" width="92" height="30" rx="15" />
        </g>
      </svg>
    </div>
    <div id="app"></div>
    <noscript>Em Time needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
